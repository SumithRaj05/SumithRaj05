<svg xmlns="http://www.w3.org/2000/svg" width="800" height="70" viewBox="0 0 800 70">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="70" fill="#05080f"/>
  <path d="M20 35 H120 L140 20 H660 L680 35 H780" fill="none" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow)" opacity="0.8"/>
  <path d="M20 40 H110 L130 55 H670 L690 40 H780" fill="none" stroke="#ffb800" stroke-width="1" opacity="0.5"/>
  <text x="400" y="42" text-anchor="middle" fill="#e0f2fe" font-family="Consolas, monospace" font-size="16" letter-spacing="6" filter="url(#glow)">MISSION CONTROL</text>
  <circle cx="150" cy="28" r="3" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="28" r="3" fill="#ffb800">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
