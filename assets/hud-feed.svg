<svg xmlns="http://www.w3.org/2000/svg" width="800" height="72" viewBox="0 0 800 72">
  <rect x="1" y="1" width="798" height="70" rx="8" fill="#0a1628" stroke="#00f0ff" stroke-width="1.5"/>
  <rect x="12" y="12" width="8" height="8" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="28" y="22" fill="#00f0ff" font-family="Consolas,monospace" font-size="11" letter-spacing="2">LIVE FEED // SMRITI</text>
  <text x="400" y="52" text-anchor="middle" fill="#67e8f9" font-family="Consolas,monospace" font-size="16">
    SMRITI, run diagnostics.
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.5;1" dur="6s" repeatCount="indefinite"/>
