<svg xmlns="http://www.w3.org/2000/svg" width="800" height="72" viewBox="0 0 800 72">
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="798" height="70" rx="8" fill="url(#panel)" stroke="#00f0ff" stroke-width="1.5"/>
  <rect x="12" y="12" width="8" height="8" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="28" y="22" fill="#00f0ff" font-family="Consolas,monospace" font-size="11" letter-spacing="2">LIVE FEED // JARVIS</text>
  <text x="400" y="52" text-anchor="middle" fill="#67e8f9" font-family="Consolas,monospace" font-size="16">
    Jarvis, run diagnostics.
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.5;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="52" text-anchor="middle" fill="#67e8f9" font-family="Consolas,monospace" font-size="16" opacity="0">
    I break things so you don't have to.
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.55;0.9;0.95;1" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
