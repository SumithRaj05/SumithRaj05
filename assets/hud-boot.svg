<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#05080f"/>

  <!-- SMRITI core -->
  <g transform="translate(400,72)">
    <circle r="62" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.25"/>
    <circle r="50" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="12 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="38" fill="none" stroke="#ffb800" stroke-width="1.6" opacity="0.85" stroke-dasharray="6 9">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="24" fill="#00f0ff" opacity="0.35">
      <animate attributeName="r" values="22;27;22" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#061018" stroke="#00f0ff" stroke-width="2"/>
    <circle r="5" fill="#00f0ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Boot panel -->
  <rect x="40" y="150" width="720" height="230" rx="10" fill="#0a1628" stroke="#00f0ff" stroke-width="1.5"/>
  <path d="M40 170 V150 H60" fill="none" stroke="#ffb800" stroke-width="2"/>
  <path d="M760 170 V150 H740" fill="none" stroke="#ffb800" stroke-width="2"/>
  <path d="M40 360 V380 H60" fill="none" stroke="#ffb800" stroke-width="2"/>
  <path d="M760 360 V380 H740" fill="none" stroke="#ffb800" stroke-width="2"/>

  <rect x="54" y="162" width="8" height="8" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="70" y="172" fill="#00f0ff" font-family="Consolas,monospace" font-size="11" letter-spacing="2">SMRITI AI // SUMITH&apos;S PERSONAL ASSISTANT</text>

  <!-- Clean name mark (no broken ASCII) -->
  <text x="400" y="230" text-anchor="middle" fill="#67e8f9" font-family="Consolas,monospace" font-size="48" font-weight="bold" letter-spacing="10">SUMITHRAJ</text>
  <line x1="200" y1="248" x2="600" y2="248" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
  <text x="400" y="272" text-anchor="middle" fill="#ffb800" font-family="Consolas,monospace" font-size="12" letter-spacing="4">TECH ENTHUSIAST  ·  BUILDER  ·  LINUX</text>

  <g font-family="Consolas,monospace" font-size="13">
    <text x="400" y="310" text-anchor="middle" fill="#34d399">
      &gt;&gt;&gt; BOOTING AGENT CONTROL... OK
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="332" text-anchor="middle" fill="#ffb800">&gt;&gt;&gt; LINUX KERNEL: online</text>
    <text x="400" y="354" text-anchor="middle" fill="#a78bfa">
      &gt;&gt;&gt; AGENT KERNEL: overcaffeinated
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
