<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0ffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#003344" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- transparent page bg -->
  <rect width="800" height="420" fill="#05080f"/>

  <!-- ARC REACTOR (top) -->
  <g transform="translate(400,78)">
    <circle r="68" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.25"/>
    <circle r="56" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)" stroke-dasharray="14 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="42" fill="none" stroke="#ffb800" stroke-width="1.8" opacity="0.8" stroke-dasharray="7 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="26;30;26" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="11" fill="#061018" stroke="#00f0ff" stroke-width="2"/>
    <circle r="4.5" fill="#00f0ff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- JARVIS BOOT PANEL -->
  <rect x="40" y="168" width="720" height="230" rx="10" fill="url(#panel)" stroke="#00f0ff" stroke-width="1.5"/>
  <!-- corner accents -->
  <path d="M40 188 V168 H60" fill="none" stroke="#ffb800" stroke-width="2"/>
  <path d="M760 188 V168 H740" fill="none" stroke="#ffb800" stroke-width="2"/>
  <path d="M40 378 V398 H60" fill="none" stroke="#ffb800" stroke-width="2"/>
  <path d="M760 378 V398 H740" fill="none" stroke="#ffb800" stroke-width="2"/>

  <rect x="54" y="180" width="8" height="8" fill="#00f0ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="70" y="190" fill="#00f0ff" font-family="Consolas, monospace" font-size="11" letter-spacing="3">HUD // BOOT SEQUENCE</text>

  <!-- scan line inside panel -->
  <rect x="50" y="200" width="700" height="2" fill="#00f0ff" opacity="0.25">
    <animate attributeName="y" values="200;380;200" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ASCII name -->
  <g fill="#67e8f9" font-family="Consolas, 'Courier New', monospace" font-size="11.5" filter="url(#softGlow)">
    <text x="400" y="230" text-anchor="middle">   _____                 _ __  __     ____        _   </text>
    <text x="400" y="246" text-anchor="middle">  / ___/__  ______ ___  (_) /_/ /_   / __ \____ _(_) </text>
    <text x="400" y="262" text-anchor="middle">  \__ \/ / / / __ `__ \/ / __/ __ \ / /_/ / __ `/ / </text>
    <text x="400" y="278" text-anchor="middle"> ___/ / /_/ / / / / / / / /_/ / / // _, _/ /_/ / /  </text>
    <text x="400" y="294" text-anchor="middle">/____/\__,_/_/ /_/ /_/_/\__/_/ /_//_/ |_|\__,_\_/  </text>
  </g>

  <!-- boot lines -->
  <g font-family="Consolas, monospace" font-size="13">
    <text x="400" y="330" text-anchor="middle" fill="#34d399">
      >>> BOOTING QA MISSION CONTROL... OK
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="352" text-anchor="middle" fill="#ffb800">
      >>> LINUX KERNEL: online
    </text>
    <text x="400" y="374" text-anchor="middle" fill="#a78bfa">
      >>> BUG DETECTOR: overcaffeinated
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
