<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#05080f"/>

  <!-- SMRITI core - top LEFT -->
  <g transform="translate(110,90)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.25"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="12 8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffb800" stroke-width="1.6" opacity="0.85" stroke-dasharray="6 9">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="26" fill="#00f0ff" opacity="0.35">
      <animate attributeName="r" values="24;30;24" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="14" fill="#061018" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#00f0ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- WELCOME parallelogram - top RIGHT with glitch -->
  <g transform="translate(280,30)">
    <!-- glitch layers -->
    <polygon points="40,20 480,20 450,130 10,130" fill="#ff0044" opacity="0">
      <animate attributeName="opacity" values="0;0;0.35;0;0;0.2;0" keyTimes="0;0.1;0.12;0.14;0.7;0.72;1" dur="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -6 2; 0 0; 4 -1; 0 0" dur="3.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="40,20 480,20 450,130 10,130" fill="#00f0ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0.4;0;0;0.25;0" keyTimes="0;0.2;0.45;0.47;0.49;0.85;0.87;1" dur="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 7 -2; 0 0; -5 1; 0 0" dur="3.5s" repeatCount="indefinite"/>
    </polygon>
    <!-- main parallelogram -->
    <polygon points="40,20 480,20 450,130 10,130" fill="#0a1628" stroke="#00f0ff" stroke-width="2"/>
    <polygon points="50,30 460,30 438,115 28,115" fill="none" stroke="#ffb800" stroke-width="1" opacity="0.55"/>
    <!-- scan / glitch bars -->
    <rect x="55" y="40" width="400" height="3" fill="#00f0ff" opacity="0.35" transform="skewX(-12)">
      <animate attributeName="y" values="30;110;30" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="55" y="70" width="400" height="2" fill="#ffb800" opacity="0" transform="skewX(-12)">
      <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.3;0.33;0.36;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="245" y="85" text-anchor="middle" fill="#67e8f9" font-family="Consolas,monospace" font-size="36" font-weight="bold" letter-spacing="6">
      WELCOME!!
      <animate attributeName="opacity" values="1;1;0.4;1;1;0.55;1" keyTimes="0;0.4;0.42;0.45;0.75;0.78;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <!-- chromatic aberration text ghosts -->
    <text x="245" y="85" text-anchor="middle" fill="#ff0044" font-family="Consolas,monospace" font-size="36" font-weight="bold" letter-spacing="6" opacity="0">
      WELCOME!!
      <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.55;0.57;0.6;1" dur="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -4 0; 0 0" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="245" y="85" text-anchor="middle" fill="#00f0ff" font-family="Consolas,monospace" font-size="36" font-weight="bold" letter-spacing="6" opacity="0">
      WELCOME!!
      <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.55;0.57;0.6;1" dur="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 0; 0 0" dur="3.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Boot panel -->
  <rect x="40" y="180" width="720" height="200" rx="10" fill="#0a1628" stroke="#00f0ff" stroke-width="1.5"/>
  <path d="M40 200 V180 H60" fill="none" stroke="#ffb800" stroke-width="2"/>
  <path d="M760 200 V180 H740" fill="none" stroke="#ffb800" stroke-width="2"/>
  <path d="M40 360 V380 H60" fill="none" stroke="#ffb800" stroke-width="2"/>
  <path d="M760 360 V380 H740" fill="none" stroke="#ffb800" stroke-width="2"/>

  <rect x="54" y="192" width="8" height="8" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="70" y="202" fill="#00f0ff" font-family="Consolas,monospace" font-size="11" letter-spacing="2">SMRITI AI // SUMITH&apos;S PERSONAL ASSISTANT</text>

  <!-- Name mark -->
  <text x="400" y="250" text-anchor="middle" fill="#67e8f9" font-family="Consolas,monospace" font-size="28" font-weight="bold" letter-spacing="3">SUMITH RAJPUROHIT</text>
  <line x1="120" y1="266" x2="680" y2="266" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
  <text x="400" y="290" text-anchor="middle" fill="#ffb800" font-family="Consolas,monospace" font-size="12" letter-spacing="4">TECH ENTHUSIAST  |  BUILDER  |  LINUX</text>

  <g font-family="Consolas,monospace" font-size="13">
    <text x="400" y="325" text-anchor="middle" fill="#34d399">
      &gt;&gt;&gt; BOOTING AGENT CONTROL... OK
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="347" text-anchor="middle" fill="#ffb800">&gt;&gt;&gt; LINUX KERNEL: online</text>
    <text x="400" y="369" text-anchor="middle" fill="#a78bfa">
      &gt;&gt;&gt; AGENT KERNEL: overcaffeinated
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
