<svg xmlns="http://www.w3.org/2000/svg" width="720" height="90" viewBox="0 0 720 90">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffb800" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="90" fill="#05080f"/>
  <line x1="40" y1="45" x2="680" y2="45" stroke="url(#g)" stroke-width="1.5" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </line>
  <polygon points="360,28 372,45 360,62 348,45" fill="#00f0ff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <text x="360" y="82" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="11" letter-spacing="4">JARVIS // SYSTEMS ONLINE</text>
</svg>
