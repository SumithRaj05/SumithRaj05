<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="798" height="218" rx="10" fill="url(#bg)" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="14" y="14" width="8" height="8" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="24" fill="#c4b5fd" font-family="Consolas, monospace" font-size="12" letter-spacing="3">AI ARSENAL // NEURAL OPS</text>

  <!-- left brain orb -->
  <g transform="translate(90,120)">
    <circle r="48" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
    <circle r="36" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8 6" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="18" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
    <text y="5" text-anchor="middle" fill="#e9d5ff" font-family="Consolas, monospace" font-size="11">AI</text>
  </g>

  <!-- status rows -->
  <g font-family="Consolas, monospace" font-size="13" fill="#e0e7ff">
    <text x="200" y="70" fill="#67e8f9">¸ RAG / OLLAMA</text>
    <text x="420" y="70" fill="#34d399">ACTIVE</text>
    <text x="520" y="70" fill="#94a3b8">local models · argue with docs</text>

    <text x="200" y="105" fill="#67e8f9">¸ CUSTOM RAG</text>
    <text x="420" y="105" fill="#34d399">ACTIVE</text>
    <text x="520" y="105" fill="#94a3b8">pipeline experiments</text>

    <text x="200" y="140" fill="#67e8f9">¸ NN CHATBOTS</text>
    <text x="420" y="140" fill="#fbbf24">STANDBY</text>
    <text x="520" y="140" fill="#94a3b8">neural nets · spicy takes</text>

    <text x="200" y="175" fill="#67e8f9">¸ EMOTION ML</text>
    <text x="420" y="175" fill="#fbbf24">STANDBY</text>
    <text x="520" y="175" fill="#94a3b8">detects feelings · ignores mine</text>
  </g>

  <!-- pulse bar -->
  <rect x="200" y="195" width="520" height="4" rx="2" fill="#1e1b4b"/>
  <rect x="200" y="195" width="180" height="4" rx="2" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="width" values="80;480;180" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
