<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="798" height="198" rx="10" fill="url(#bg)" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="14" y="14" width="8" height="8" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="24" fill="#c4b5fd" font-family="Consolas, monospace" font-size="12" letter-spacing="3">AI ARSENAL // NEURAL OPS</text>

  <g transform="translate(90,115)">
    <circle r="42" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
    <circle r="32" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="7 5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
    <text y="4" text-anchor="middle" fill="#e9d5ff" font-family="Consolas, monospace" font-size="11">AI</text>
  </g>

  <g font-family="Consolas, monospace" font-size="13">
    <rect x="170" y="48" width="280" height="52" rx="4" fill="#100818" stroke="#a78bfa55"/>
    <text x="190" y="70" fill="#67e8f9" font-size="11">? RAG / OLLAMA</text>
    <text x="190" y="88" fill="#34d399" font-size="12" font-weight="bold">ACTIVE · local models</text>

    <rect x="470" y="48" width="300" height="52" rx="4" fill="#100818" stroke="#a78bfa55"/>
    <text x="490" y="70" fill="#67e8f9" font-size="11">? CUSTOM RAG</text>
    <text x="490" y="88" fill="#34d399" font-size="12" font-weight="bold">ACTIVE · pipeline labs</text>

    <rect x="170" y="118" width="280" height="52" rx="4" fill="#100818" stroke="#ffb80044"/>
    <text x="190" y="140" fill="#67e8f9" font-size="11">? NN CHATBOTS</text>
    <text x="190" y="158" fill="#fbbf24" font-size="12" font-weight="bold">STANDBY · spicy takes</text>

    <rect x="470" y="118" width="300" height="52" rx="4" fill="#100818" stroke="#ffb80044"/>
    <text x="490" y="140" fill="#67e8f9" font-size="11">? EMOTION ML</text>
    <text x="490" y="158" fill="#fbbf24" font-size="12" font-weight="bold">STANDBY · ignores mine</text>
