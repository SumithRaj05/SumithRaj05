<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0ffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#003344" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="90" cy="90" r="84" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.25"/>
  <circle cx="90" cy="90" r="70" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)" stroke-dasharray="12 8">
    <animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="90" r="54" fill="none" stroke="#ffb800" stroke-width="1.5" opacity="0.7" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" from="360 90 90" to="0 90 90" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="90" r="36" fill="url(#core)" filter="url(#glow)">
    <animate attributeName="r" values="34;38;34" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="90" r="14" fill="#061018" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="90" cy="90" r="6" fill="#00f0ff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
